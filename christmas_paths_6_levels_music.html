<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Χριστουγεννιάτικες Διαδρομές</title><style>body{margin:0;font-family:system-ui,Arial;background:linear-gradient(#d9f2ff,#f8fcff);color:#17324d;text-align:center}header{padding:14px}h1{margin:5px;font-size:clamp(22px,4vw,35px)}p{margin:7px}.bar{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:8px}button{background:#156b66;color:white;border:0;border-radius:12px;padding:11px 16px;font-weight:bold;cursor:pointer}button:focus-visible{outline:3px solid orange}#wrap{width:min(96vw,900px);margin:8px auto;position:relative}canvas{width:100%;touch-action:none;border:5px solid #fff;border-radius:18px;box-shadow:0 8px 30px #47658255;background:#e8f7ff}#status{min-height:28px;font-weight:bold}small{display:block;margin:12px} </style></head><body><header><h1>🎄 Χριστουγεννιάτικες Διαδρομές 🍬</h1><p>Σχεδίασε γραμμές για να οδηγήσεις τα ζαχαρωτά στα σωστά φλιτζάνια! Έξι επίπεδα με αυξανόμενη δυσκολία.</p><div class="bar"><button id="music" aria-pressed="false">🎵 Μουσική: Κλειστή</button><button id="restart">↻ Ξανά το επίπεδο</button><button id="erase">🧽 Σβήσε τις γραμμές</button><button id="next" hidden>Επόμενο επίπεδο ➜</button></div><div id="status" aria-live="polite"></div></header><div id="wrap"><canvas id="game" width="900" height="550" aria-label="Παιχνίδι με ζαχαρωτά και γραμμές"></canvas></div><script>
(()=>{'use strict';
// Original, gentle festive melody synthesized locally with Web Audio (no external audio files).
let audioCtx=null,musicTimer=null,musicOn=false,musicStep=0;
const musicButton=document.getElementById('music');
const tune=[659,659,659,0,659,659,659,0,659,784,523,587,659,0,698,698,698,698,698,659,659,659,659,587,587,659,587,0,784,0];
function playTone(freq,when,duration){if(!freq||!audioCtx)return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(0.0001,when);gain.gain.exponentialRampToValueAtTime(0.055,when+0.025);gain.gain.exponentialRampToValueAtTime(0.0001,when+duration);osc.connect(gain).connect(audioCtx.destination);osc.start(when);osc.stop(when+duration+0.02)}
function musicTick(){if(!musicOn||!audioCtx)return;playTone(tune[musicStep%tune.length],audioCtx.currentTime+0.015,0.19);musicStep++}
musicButton.addEventListener('click',async()=>{if(musicOn){musicOn=false;clearInterval(musicTimer);musicTimer=null;musicButton.textContent='🎵 Μουσική: Κλειστή';musicButton.setAttribute('aria-pressed','false');return;}try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();musicOn=true;musicStep=0;musicTick();musicTimer=setInterval(musicTick,270);musicButton.textContent='🔊 Μουσική: Ανοιχτή';musicButton.setAttribute('aria-pressed','true')}catch(err){musicButton.textContent='🔇 Δεν υποστηρίζεται ήχος';}});
const c=document.getElementById('game'),ctx=c.getContext('2d'),status=document.getElementById('status'),next=document.getElementById('next');const W=900,H=550;let level=0,lines=[],balls=[],drawing=false,current=null,won=false,spawn=0,emitted=0,received=[],last=0;const levels=[{name:'1 · Ένα φλιτζάνι',sources:[{x:170,color:0}],cups:[{x:720,color:0}],needed:12,rate:24},{name:'2 · Δύο φλιτζάνια',sources:[{x:450,color:0}],cups:[{x:200,color:0},{x:700,color:0}],needed:10,rate:20},{name:'3 · Δύο χρώματα',sources:[{x:270,color:0},{x:630,color:1}],cups:[{x:180,color:0},{x:720,color:1}],needed:12,rate:19},{name:'4 · Αντίθετες πλευρές',sources:[{x:150,color:0},{x:750,color:1}],cups:[{x:180,color:1},{x:710,color:0}],needed:14,rate:17},{name:'5 · Τρία φλιτζάνια',sources:[{x:180,color:0},{x:720,color:1}],cups:[{x:155,color:1},{x:450,color:0},{x:745,color:1}],needed:15,rate:15},{name:'6 · Η μεγάλη χριστουγεννιάτικη δοκιμασία',sources:[{x:125,color:0},{x:440,color:1},{x:775,color:0}],cups:[{x:140,color:1},{x:350,color:0},{x:560,color:1},{x:770,color:0}],needed:18,rate:13}];const colors=['#ed4a4a','#2aa776'];function reset(){lines=[];balls=[];drawing=false;current=null;won=false;spawn=0;emitted=0;received=levels[level].cups.map(()=>0);next.hidden=true;status.textContent=`Επίπεδο ${level+1}/${levels.length} — Γέμισε τα φλιτζάνια!`; }function xy(e){let r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}c.addEventListener('pointerdown',e=>{if(won)return;c.setPointerCapture(e.pointerId);drawing=true;current=[xy(e)];lines.push(current)});c.addEventListener('pointermove',e=>{if(!drawing)return;let p=xy(e),a=current[current.length-1];if(Math.hypot(p.x-a.x,p.y-a.y)>5)current.push(p)});function stop(){drawing=false;current=null}c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop);document.getElementById('restart').onclick=reset;document.getElementById('erase').onclick=()=>{lines=[]};next.onclick=()=>{if(level<levels.length-1){level++;reset()}};
function lineCollision(b,a,d){let vx=d.x-a.x,vy=d.y-a.y,t=Math.max(0,Math.min(1,((b.x-a.x)*vx+(b.y-a.y)*vy)/(vx*vx+vy*vy||1))),px=a.x+t*vx,py=a.y+t*vy,dx=b.x-px,dy=b.y-py,dist=Math.hypot(dx,dy);if(dist<7.5&&dist>.01){let nx=dx/dist,ny=dy/dist;if(b.vx*nx+b.vy*ny<0){let dot=b.vx*nx+b.vy*ny;b.vx-=1.5*dot*nx;b.vy-=1.5*dot*ny;b.vx+=nx*.1;b.vy+=ny*.1;}b.x+=nx*(7.5-dist);b.y+=ny*(7.5-dist)}}function update(dt){if(won)return;let l=levels[level];spawn+=dt;if(spawn>l.rate&&emitted<240){spawn=0;let s=l.sources[emitted%l.sources.length];balls.push({x:s.x,y:70,vx:(Math.random()-.5)*.3,vy:0,color:s.color});emitted++}for(let b of balls){for(let sub=0;sub<2;sub++){b.vy+=.12*dt;b.vy=Math.min(6,b.vy);b.x+=b.vx*dt*.5;b.y+=b.vy*dt*.5;for(let line of lines)for(let j=1;j<line.length;j++)lineCollision(b,line[j-1],line[j]);if(b.x<7||b.x>W-7)b.vx*=-.6;b.x=Math.max(7,Math.min(W-7,b.x))}for(let i=0;i<l.cups.length;i++){let cup=l.cups[i];if(b.y>475&&b.y<530&&Math.abs(b.x-cup.x)<43&&b.color===cup.color){b.dead=true;received[i]++;break}}if(b.y>H+20)b.dead=true}balls=balls.filter(b=>!b.dead);if(received.every(n=>n>=l.needed)){won=true;status.textContent=level===levels.length-1?'🎉 Μπράβο! Ολοκλήρωσες όλα τα επίπεδα!':'🎉 Μπράβο! Γέμισες τα φλιτζάνια!';if(level<levels.length-1)next.hidden=false}else status.textContent=`Επίπεδο ${level+1}/${levels.length} — ${received.map((n,i)=>'Φλιτζάνι '+(i+1)+': '+Math.min(n,l.needed)+'/'+l.needed).join(' · ')}`}
function draw(){ctx.clearRect(0,0,W,H);let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#d7f2ff');grad.addColorStop(1,'#fff7ed');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';for(let i=0;i<35;i++){let x=(i*173+37)%900,y=(i*97+30)%440;ctx.beginPath();ctx.arc(x,y,2+(i%3),0,Math.PI*2);ctx.fill()}ctx.font='bold 22px system-ui';ctx.fillStyle='#2c5366';ctx.fillText('❄️ Οδήγησε τα ζαχαρωτά!',25,34);let l=levels[level];for(let s of l.sources){ctx.fillStyle='#a36c48';ctx.fillRect(s.x-26,48,52,17);ctx.fillStyle=colors[s.color];ctx.fillRect(s.x-19,61,38,7);ctx.font='23px system-ui';ctx.fillText('🍬',s.x-14,46)}for(let i=0;i<l.cups.length;i++){let cup=l.cups[i];ctx.fillStyle='#ffffff';ctx.strokeStyle=colors[cup.color];ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(cup.x-49,478);ctx.lineTo(cup.x-43,536);ctx.lineTo(cup.x+43,536);ctx.lineTo(cup.x+49,478);ctx.stroke();ctx.fill();ctx.fillStyle=colors[cup.color];ctx.fillRect(cup.x-48,478,96,8);ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.fillText(Math.min(received[i],l.needed)+'/'+l.needed,cup.x,520);ctx.textAlign='left'}ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#7c4b31';ctx.lineWidth=7;for(let line of lines){ctx.beginPath();line.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}for(let b of balls){ctx.fillStyle=colors[b.color];ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke()}if(won){ctx.fillStyle='#ffffffdf';ctx.fillRect(210,205,480,105);ctx.fillStyle='#157e65';ctx.font='bold 34px system-ui';ctx.textAlign='center';ctx.fillText('🎉 ΤΑ ΚΑΤΑΦΕΡΕΣ! 🎉',450,267);ctx.textAlign='left'}}function frame(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;update(dt);draw();requestAnimationFrame(frame)}reset();requestAnimationFrame(frame)})();
</script></body></html>
